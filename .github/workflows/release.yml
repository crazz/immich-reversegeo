name: Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Optional label for the release artifacts"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve candidate metadata
        id: metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:SOURCE_COMMIT) { throw 'Checkout does not match candidate source.' }
          $env:PROJECT_VERSION = dotnet msbuild src/ImmichReverseGeo.Web/ImmichReverseGeo.Web.csproj -getProperty:Version
          if ($LASTEXITCODE -ne 0) { throw 'Could not read project Version.' }
          ./.github/scripts/Release-Artifacts.ps1 -Action Metadata

      - name: Test release verification helpers
        shell: pwsh
        run: ./.github/scripts/Test-ReleaseArtifacts.ps1

      - name: Install docs dependencies
        run: pip install -r docs/website/requirements.txt

      - name: Restore
        run: dotnet restore immich-reversegeo.slnx

      - name: Test
        run: dotnet test --solution immich-reversegeo.slnx --configuration Release --filter "TestCategory!=Integration&TestCategory!=Performance"

      - name: Publish versioned app
        shell: pwsh
        env:
          INFORMATIONAL_VERSION: ${{ steps.metadata.outputs.informational_version }}
        run: |
          dotnet publish src/ImmichReverseGeo.Web/ImmichReverseGeo.Web.csproj -c Release -o artifacts/web -p:InformationalVersion=$env:INFORMATIONAL_VERSION -p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { throw 'App publish failed.' }
          $assemblyPath = [IO.Path]::GetFullPath('artifacts/web/ImmichReverseGeo.Web.dll')
          $productVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($assemblyPath).ProductVersion
          if ($productVersion -ne $env:INFORMATIONAL_VERSION) { throw 'Published assembly version does not match candidate metadata.' }
          New-Item -ItemType Directory -Force -Path 'artifacts/web/bundled-data' | Out-Null
          Get-ChildItem -LiteralPath 'src/ImmichReverseGeo.Web/bundled-data' -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination 'artifacts/web/bundled-data' -Recurse -Force
          }
          Copy-Item -LiteralPath '_out/release-metadata.json' -Destination 'artifacts/web/release-build.json'

      - name: Build docs
        run: zensical build --clean --strict

      - name: Archive app
        run: Compress-Archive -Path artifacts/web/* -DestinationPath immich-reversegeo-web.zip
        shell: pwsh

      - name: Archive docs
        run: Compress-Archive -Path _out/website/* -DestinationPath immich-reversegeo-docs.zip
        shell: pwsh

      - name: Verify release packages
        shell: pwsh
        run: ./.github/scripts/Release-Artifacts.ps1 -Action Verify

      - name: Upload verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_name != '' && format('{0}-verification', inputs.release_name) || 'immich-reversegeo-verification' }}
          path: _out/release-verification

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_name != '' && format('{0}-web', inputs.release_name) || 'immich-reversegeo-web' }}
          path: immich-reversegeo-web.zip

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_name != '' && format('{0}-docs', inputs.release_name) || 'immich-reversegeo-docs' }}
          path: immich-reversegeo-docs.zip
