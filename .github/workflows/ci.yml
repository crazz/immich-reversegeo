name: CI

on:
  push:
    branches:
      - master
      - major-redesign
  pull_request:

jobs:
  app:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore immich-reversegeo.slnx

      - name: Build
        run: dotnet build immich-reversegeo.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution immich-reversegeo.slnx --configuration Release --no-build --filter "TestCategory!=Integration&TestCategory!=Performance"

      - name: Build Docker image
        run: docker build -f src/ImmichReverseGeo.Web/Dockerfile -t immich-reversegeo:test .

  change23:
    name: Change 23 focused tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run Change 23 focused tests
        run: dotnet test --project tests/ImmichReverseGeo.Tests/ImmichReverseGeo.Tests.csproj --configuration Release --filter "TestCategory=Change23"

  change26:
    name: Worker lifecycle and failure recovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build fixture staging
        run: dotnet build tests/ImmichReverseGeo.Tests/ImmichReverseGeo.Tests.csproj --configuration Release

      - name: Run worker lifecycle and failure recovery tests without rebuilding
        run: dotnet test --project tests/ImmichReverseGeo.Tests/ImmichReverseGeo.Tests.csproj --configuration Release --no-build --filter "TestCategory=Change26|TestCategory=Change28|TestCategory=Change29|TestCategory=Change30"

      - name: Publish fixture staging
        run: dotnet publish tests/ImmichReverseGeo.Tests/ImmichReverseGeo.Tests.csproj --configuration Release --output _out/change26-publish

      - name: Smoke published fixture staging without rebuilding
        run: dotnet _out/change26-publish/ImmichReverseGeo.Tests.dll --filter "TestCategory=Change26|TestCategory=Change28|TestCategory=Change29|TestCategory=Change30"
