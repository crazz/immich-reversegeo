name: Publish Docker Image

on:
  release:
    types: [published]
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "src/ImmichReverseGeo.Web/Dockerfile"
      - ".github/workflows/docker-publish.yml"
      - ".github/scripts/promote-latest.sh"
      - ".github/scripts/validate-release-version.sh"
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Publish latest in addition to sha tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash .github/scripts/validate-release-version.sh

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/immich-reversegeo
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/ImmichReverseGeo.Web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  promote-latest:
    needs: publish
    if: ${{ (github.event_name == 'release' && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.publish_latest == true) }}
    runs-on: ubuntu-latest
    concurrency:
      group: docker-latest-promotion
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote built image to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          MANUAL_PROMOTION: ${{ inputs.publish_latest }}
          SOURCE_IMAGE: ${{ needs.publish.outputs.image }}
          SOURCE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: bash .github/scripts/promote-latest.sh
