name: Publish Docker Image

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "src/ImmichReverseGeo.Web/Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Publish latest in addition to sha tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/immich-reversegeo
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_latest == true }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/ImmichReverseGeo.Web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install candidate smoke prerequisites
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_latest
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace sqlite3 jq iptables

      - name: Test published candidate by digest
        id: candidate_smoke
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_latest
        env:
          CANDIDATE_IMAGE: ghcr.io/${{ github.repository_owner }}/immich-reversegeo@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p _out/candidate-image
          printf '%s\n' "$CANDIDATE_IMAGE" > _out/candidate-image/image.txt
          printf '%s\n' "$GITHUB_SHA" > _out/candidate-image/revision.txt
          docker pull "$CANDIDATE_IMAGE"
          docker image inspect --format '{{.Id}}' "$CANDIDATE_IMAGE" > _out/candidate-image/image-id.txt
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$CANDIDATE_IMAGE")" = "$GITHUB_SHA"
          printf 'Candidate image: `%s`\n\nSource revision: `%s`\n' "$CANDIDATE_IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          npm run test:docker-smoke -- --image "$CANDIDATE_IMAGE"

      - name: Clean owned candidate smoke resources
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.publish_latest
        run: |
          shopt -s nullglob
          status=0
          for run in _out/docker-mode-smoke/immich46-*; do
            timeout --signal=TERM --kill-after=5s 30s bash scripts/docker-mode-smoke.sh --cleanup-only "${run##*/}" || status=$?
          done
          exit "$status"

      - name: Upload candidate identity and smoke evidence
        if: always() && (steps.candidate_smoke.outcome == 'success' || steps.candidate_smoke.outcome == 'failure')
        uses: actions/upload-artifact@v6
        with:
          name: candidate-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _out/candidate-image/
            _out/docker-mode-smoke/*/evidence/
          if-no-files-found: error
          retention-days: 7
